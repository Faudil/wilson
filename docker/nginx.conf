server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'" always;

  location /rpc/ { proxy_pass http://api:3000; proxy_set_header Host $host; }
  location /webhooks/ { proxy_pass http://api:3000; }
  location / { try_files $uri /index.html; }
}

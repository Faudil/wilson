# Production stack, run on the server by scripts/deploy/remote-deploy.sh (GitHub Actions deploy).
#   docker compose -f docker-compose.prod.yml up -d --build
# Configuration and secrets come from the server's own `.env` (see .env.production.example):
# they are never in git and never pass through CI.
# Nothing is published on a host port. The back-office joins your nginx-proxy network
# (${PROXY_NETWORK:-internal_services_network}) and nginx-proxy + acme-companion serve it on
# https://${PUBLIC_HOST} with a Let's Encrypt certificate. The back-office forwards /rpc and
# /webhooks to the API itself; the API, Postgres and S3 stay on the stack's private network.
# Data lives in the named volumes wilson-prod_pgdata, wilson-prod_s3data, wilson-prod_backups.
# No deploy step removes them. Never run `docker compose down -v` here: it deletes them.
# For local development use docker-compose.yml.
name: wilson-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wilson
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: wilson
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wilson -d wilson"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Daily database dump into the backups volume, plus an encrypted off-site copy (database + document blobs)
  # when BACKUP_S3_BUCKET and BACKUP_AGE_RECIPIENT are set. See docs/security.md.
  backup:
    build: { context: ., dockerfile: docker/backup.Dockerfile }
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: wilson
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: wilson
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-wilson}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-}
      # Read access to the bundled document storage, to copy the (already encrypted) blobs off-site.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9000}
      S3_BUCKET: ${S3_BUCKET:-wilson}
      S3_REGION: ${S3_REGION:-fr-par}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      TZ: ${TIMEZONE:-Europe/Paris}
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  # S3-compatible storage for the encrypted documents. Credentials come from .env.
  s3:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        printf '{"identities":[{"name":"wilson","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/status || exit 1"]
      interval: 5s
      retries: 30

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RUNTIME: server
      DATABASE_URL: postgres://wilson:${POSTGRES_PASSWORD}@postgres:5432/wilson
      # Keep the bundled SeaweedFS, or point these at an EU provider (Scaleway fr-par, OVH gra...).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9000}
      PUBLIC_BACKOFFICE_ORIGIN: ${PUBLIC_ORIGIN:-https://${PUBLIC_HOST}}
      PROMPTS_DIR: /app/prompts
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }

  backoffice:
    build: { context: ., dockerfile: docker/backoffice.Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    environment:
      # Read by nginx-proxy / acme-companion on the shared proxy network.
      VIRTUAL_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env, e.g. courrier.example.org}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${PUBLIC_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?set LETSENCRYPT_EMAIL in .env}
    networks:
      - default
      - proxy

volumes:
  pgdata:
  s3data:
  backups:

networks:
  # Created by your nginx-proxy setup, shared with its other sites.
  proxy:
    name: ${PROXY_NETWORK:-internal_services_network}
    external: true

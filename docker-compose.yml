# Local stack: `cp .env.example .env` (set MASTER_KEY / LOOKUP_KEY), then `docker compose up --build`.
# Back-office: http://localhost:8080 · API: http://localhost:3000
name: wilson

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wilson
      POSTGRES_PASSWORD: wilson
      POSTGRES_DB: wilson
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wilson"]
      interval: 3s
      retries: 20

  # S3-compatible storage (local stand-in for an EU provider such as Scaleway / OVH).
  # Credentials for local dev are in docker/seaweedfs-s3.json and must match S3_ACCESS_KEY / S3_SECRET_KEY.
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    volumes:
      - s3data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/status || exit 1"]
      interval: 3s
      retries: 30

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://wilson:wilson@postgres:5432/wilson
      S3_ENDPOINT: http://s3:9000
      PUBLIC_BACKOFFICE_ORIGIN: http://localhost:8080
      PROMPTS_DIR: /app/prompts
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]

  backoffice:
    build: { context: ., dockerfile: docker/backoffice.Dockerfile }
    depends_on: [api]
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:
  s3data:
